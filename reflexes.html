<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflexes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1a1a23;
    --border: #25252e;
    --border-2: #2a2a36;
    --text: #e8e8e8;
    --muted: #888;
    --dim: #555;
    --red: #b91c1c;
    --red-soft: #7f1d1d;
    --green: #16a34a;
    --green-soft: #14532d;
    --amber: #d97706;
    --amber-soft: #78350f;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(99, 102, 241, 0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(34, 197, 94, 0.05), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .container { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 24px; }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    background: linear-gradient(180deg, #fff, #b8b8c4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--muted); font-size: 14px; }

  .game {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .box {
    height: 280px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    text-align: center;
    padding: 20px;
    transition: background 0.08s ease, border-color 0.08s ease, transform 0.06s ease;
    outline: none;
  }

  .box:focus-visible { box-shadow: 0 0 0 3px rgba(99,102,241,0.4); }

  .box.waiting  { background: var(--red);   border-color: var(--red);   }
  .box.go       { background: var(--green); border-color: var(--green); }
  .box.too-soon { background: var(--amber); border-color: var(--amber); }
  .box.done     { background: var(--panel-2); border-color: var(--border-2); }

  .box:active { transform: scale(0.995); }
  .box.go:active { transform: scale(0.99); }

  .box .label {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }

  .box .sublabel {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.85;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .box.waiting .label,
  .box.go .label,
  .box.too-soon .label { color: #fff; }

  .stats {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  .stat .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat .value {
    font-size: 22px;
    font-weight: 700;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .stat .unit { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 500; }

  .round-bar {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .pips { display: flex; gap: 6px; }

  .pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border-2);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .pip.done  { background: var(--green); }
  .pip.false { background: var(--red); }
  .pip.active { background: #4b5563; transform: scale(1.3); }

  .results {
    margin-top: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    display: none;
    animation: fade 0.25s ease;
  }
  .results.show { display: block; }

  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .results h2 { font-size: 18px; margin-bottom: 4px; }
  .results .verdict { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat .value.big { font-size: 26px; }

  .btn {
    background: var(--text);
    color: #0a0a0f;
    border: 0;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.06s ease;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: scale(0.98); }

  .footer {
    margin-top: 16px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
  }
  .footer kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .box { height: 220px; }
    .box .label { font-size: 26px; }
    h1 { font-size: 24px; }
    .game { padding: 18px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Reflexes</h1>
      <div class="subtitle">Wait for green. Click fast.</div>
    </header>

    <div class="game">
      <div class="box" id="box" tabindex="0" role="button" aria-label="Reaction area">
        <div class="label" id="label">Click to start</div>
        <div class="sublabel" id="sublabel"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Best</div>
          <div class="value"><span id="best">—</span><span class="unit">ms</span></div>
        </div>
        <div class="stat">
          <div class="stat-label">Average</div>
          <div class="value"><span id="avg">—</span><span class="unit">ms</span></div>
        </div>
        <div class="stat">
          <div class="stat-label">Last</div>
          <div class="value"><span id="last">—</span><span class="unit">ms</span></div>
        </div>
      </div>

      <div class="round-bar">
        <span id="round-text">Round 0 of 5</span>
        <div class="pips" id="pips"></div>
      </div>

      <div class="results" id="results">
        <h2>Results</h2>
        <div class="verdict" id="verdict"></div>
        <div class="results-grid">
          <div class="stat">
            <div class="stat-label">Best</div>
            <div class="value big"><span id="r-best">—</span><span class="unit">ms</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Average</div>
            <div class="value big"><span id="r-avg">—</span><span class="unit">ms</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">False starts</div>
            <div class="value big"><span id="r-false">0</span></div>
          </div>
        </div>
        <button class="btn" id="play-again">Play again</button>
      </div>
    </div>

    <div class="footer">Click the box — or press <kbd>Space</kbd> — to react.</div>
  </div>

<script>
(() => {
  const TOTAL_ROUNDS = 5;
  const MIN_DELAY = 1200;
  const MAX_DELAY = 4000;

  const box = document.getElementById('box');
  const label = document.getElementById('label');
  const sublabel = document.getElementById('sublabel');
  const bestEl = document.getElementById('best');
  const avgEl = document.getElementById('avg');
  const lastEl = document.getElementById('last');
  const roundText = document.getElementById('round-text');
  const pipsEl = document.getElementById('pips');
  const resultsEl = document.getElementById('results');
  const verdictEl = document.getElementById('verdict');
  const rBest = document.getElementById('r-best');
  const rAvg = document.getElementById('r-avg');
  const rFalse = document.getElementById('r-false');
  const playAgain = document.getElementById('play-again');

  // State machine: idle | waiting | go | awaitingContinue | finished
  let state = 'idle';
  let goTime = 0;
  let timer = null;
  let round = 0;
  let times = [];
  let falseStarts = 0;

  function buildPips() {
    pipsEl.innerHTML = '';
    for (let i = 0; i < TOTAL_ROUNDS; i++) {
      const p = document.createElement('div');
      p.className = 'pip';
      pipsEl.appendChild(p);
    }
  }

  function setActivePip() {
    const pips = pipsEl.querySelectorAll('.pip');
    pips.forEach((p, i) => p.classList.toggle('active', i === round - 1 && state === 'waiting'));
  }

  function setBox(cls, text, sub) {
    box.className = 'box ' + (cls || '');
    label.textContent = text;
    sublabel.textContent = sub || '';
  }

  function markPip(i, cls) {
    const pips = pipsEl.querySelectorAll('.pip');
    if (pips[i]) pips[i].className = 'pip ' + cls;
  }

  function updateLiveStats() {
    if (times.length === 0) {
      bestEl.textContent = '—';
      avgEl.textContent = '—';
      lastEl.textContent = '—';
      return;
    }
    const best = Math.min(...times);
    const avg = Math.round(times.reduce((s, t) => s + t, 0) / times.length);
    const last = times[times.length - 1];
    bestEl.textContent = best;
    avgEl.textContent = avg;
    lastEl.textContent = last;
  }

  function startGame() {
    times = [];
    falseStarts = 0;
    round = 0;
    resultsEl.classList.remove('show');
    buildPips();
    updateLiveStats();
    nextRound();
  }

  function nextRound() {
    if (round >= TOTAL_ROUNDS) { finish(); return; }
    state = 'waiting';
    round++;
    roundText.textContent = `Round ${round} of ${TOTAL_ROUNDS}`;
    setBox('waiting', 'Wait for green', "Don't click yet");
    setActivePip();

    const delay = MIN_DELAY + Math.random() * (MAX_DELAY - MIN_DELAY);
    timer = setTimeout(() => {
      state = 'go';
      goTime = performance.now();
      setBox('go', 'Click!', '');
      setActivePip();
    }, delay);
  }

  function handleClick() {
    if (state === 'idle' || state === 'finished') { startGame(); return; }

    if (state === 'waiting') {
      clearTimeout(timer);
      state = 'awaitingContinue';
      falseStarts++;
      markPip(round - 1, 'false');
      setActivePip();
      setBox('too-soon', 'Too soon!', 'False start — click to continue');
      return;
    }

    if (state === 'go') {
      const reaction = Math.round(performance.now() - goTime);
      times.push(reaction);
      updateLiveStats();
      markPip(round - 1, 'done');
      state = 'awaitingContinue';
      setBox('done', `${reaction} ms`, 'Click to continue');
      return;
    }

    if (state === 'awaitingContinue') {
      nextRound();
    }
  }

  function verdictFor(avg) {
    if (avg < 200) return 'Superhuman. Are you a robot?';
    if (avg < 250) return 'Excellent reflexes.';
    if (avg < 300) return 'Solid. Above average.';
    if (avg < 400) return 'Decent. Keep practicing.';
    return 'Slow down — try to anticipate less.';
  }

  function finish() {
    state = 'finished';
    const valid = times;
    const best = valid.length ? Math.min(...valid) : null;
    const avg = valid.length ? Math.round(valid.reduce((s, t) => s + t, 0) / valid.length) : null;

    rBest.textContent = best ?? '—';
    rAvg.textContent = avg ?? '—';
    rFalse.textContent = falseStarts;
    verdictEl.textContent = avg != null ? verdictFor(avg) : 'No valid rounds.';
    resultsEl.classList.add('show');

    setBox('', 'Done', 'See results below');
    setActivePip();
  }

  box.addEventListener('click', handleClick);
  box.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      handleClick();
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && document.activeElement !== box) {
      e.preventDefault();
      handleClick();
    }
  });

  playAgain.addEventListener('click', startGame);

  buildPips();
  setActivePip();
})();
</script>
</body>
</html>
